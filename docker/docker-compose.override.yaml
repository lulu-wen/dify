# docker-compose.override.yaml
# 每個 service 就是未來 k8s 的一個 Deployment/StatefulSet
# 用 labels 標明 tier 歸屬

services:
  # ============================================================
  # TIER 1: SDK Gateway (FastAPI)
  # ============================================================

  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    container_name: gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # registry.yaml lives on the host (NOT committed — contains real SDK
      # keys + Dify console passwords). Copy registry.example.yaml to
      # gateway/registry.yaml on first run, fill it in, then compose up.
      - ../gateway/registry.yaml:/app/registry.yaml:ro
    environment:
      GATEWAY_REGISTRY_PATH: /app/registry.yaml
      # Phase 1a/1b — rate limiting on
      GATEWAY_RATE_LIMIT_ENABLED: "true"
      GATEWAY_DEFAULT_RPM: "60"
      GATEWAY_DEFAULT_RPM_BURST: "120"
      GATEWAY_DEFAULT_TPM: "0"             # 0 = unlimited; per-customer via registry
      GATEWAY_DEFAULT_TPM_BURST: "10000"
      GATEWAY_NODE_TOKEN_BUDGET: "200000"
      GATEWAY_DEFAULT_MAX_OUTPUT_TOKENS: "1024"
      GATEWAY_DEFAULT_KB_TOP_K: "3"
      GATEWAY_DEFAULT_KB_CHUNK_TOKENS: "1000"
      # Phase 2a — opt-in; flip via .env when vLLM /metrics is live
      GATEWAY_RUNTIME_METRICS_ENABLED: "${GATEWAY_RUNTIME_METRICS_ENABLED:-false}"
      GATEWAY_RUNTIME_METRICS_URL: "${GATEWAY_RUNTIME_METRICS_URL:-http://vllm:8000/metrics}"
      GATEWAY_HEADROOM_SOFT_THRESHOLD: "0.80"
      GATEWAY_HEADROOM_HARD_THRESHOLD: "0.95"
      GATEWAY_HEADROOM_EWMA_ALPHA: "0.3"
      GATEWAY_LOG_JSON: "${GATEWAY_LOG_JSON:-true}"
      GATEWAY_LOG_LEVEL: "${GATEWAY_LOG_LEVEL:-INFO}"
    depends_on:
      api:
        condition: service_started
      vllm:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      tier: edge
      role: sdk-gateway
      k8s-kind: Deployment

  # ============================================================
  # TIER 2: RAG Stack
  # ============================================================
  
  # qdrant 已在主 compose（profile: qdrant），這邊只加 labels
  qdrant:
    labels:
      tier: rag
      role: vector-store
      k8s-kind: StatefulSet     # 提示未來 k8s 怎麼翻譯
  
  # Embedding (bge-m3 via TEI)
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:89-latest
    container_name: tei
    restart: unless-stopped
    runtime: nvidia
    ports:
      - "9997:80"
    volumes:
      - ./volumes/tei-cache:/data
    environment:
      MODEL_ID: BAAI/bge-m3
      MAX_CLIENT_BATCH_SIZE: "32"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      tier: rag
      role: embedding
      k8s-kind: Deployment
  
  # ETL (Unstructured) — compose（profile: unstructured），加 labels
  unstructured:
    labels:
      tier: rag
      role: etl
      k8s-kind: Deployment

  # ============================================================
  # TIER 3: LLM Service
  # ============================================================
  
  vllm:
    image: vllm/vllm-openai:nightly-aarch64       # ← 官方 ARM64 image
    container_name: vllm
    restart: unless-stopped
    runtime: nvidia
    pull_policy: always                            # ← 對應官方的 --pull always
    ports:
      - "8000:8000"                                # ← 對應 --network host 的 8000
    volumes:
      - ./volumes/vllm-cache:/root/.cache/huggingface   # ← 模型權重快取（重啟不重下）
      - ./volumes/vllm-pip:/usr/local/lib/python3.12/site-packages   # ← pip install 也快取
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}        # ← Qwen 不是 gated 但留著無害
      VLLM_USE_V1: "1"                             # ← 用 vLLM V1 engine（更快）
    # 把官方的 bash -c 一字不漏搬過來
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        pip install -q 'vllm[audio]' && \
        vllm serve RedHatAI/Qwen3.6-35B-A3B-NVFP4 \
          --gpu-memory-utilization 0.8 \
          --enable-prefix-caching \
          --reasoning-parser qwen3 \
          --enable-auto-tool-choice \
          --tool-call-parser qwen3_coder \
          --host 0.0.0.0 \
          --port 8000 \
          --served-model-name qwen3.6-35b
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 600s                           # ← 第一次跑要下載 + pip install + 載入，10分鐘 buffer
    labels:
      tier: llm
      role: llm-inference

